[tool.poetry]
name = "aidlp"
version = "4.0.0"
description = "AI Data Loss Prevention Proxy"
authors = ["Fabrizio Salmi <fabrizio.salmi@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
mitmproxy = "^12.2.2"
flashtext = "2.7"
presidio-analyzer = "2.2.352"
presidio-anonymizer = "2.2.352"
# typer 0.12.x builds boolean flags in a way click >= 8.4 rejects with
# "Secondary flag is not valid for non-boolean flag", so the whole CLI
# fails to construct. 0.16+ is the first line that works with modern click.
typer = ">=0.16,<1.0"
pyyaml = "6.0.1"
spacy = "^3.8.2"
prometheus-client = "0.19.0"
python-json-logger = "^2.0.7"
hvac = "2.1.0"
pybreaker = "^1.3.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.2.1"
requests = "^2.33.0"  # Needed for CLI stats fetching

[tool.poetry.group.dev.dependencies]
# pytest 7.4.4 carries PYSEC-2026-1845, fixed in 9.0.3. pytest-asyncio 0.23
# capped pytest<9, so both move together; 1.x requires pytest>=8.4,<10.
pytest = ">=9.0.3,<10.0"
pytest-asyncio = "^1.4.0"
locust = "^2.20.0"
flake8 = "^7.3.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
# Unconstrained, the exact poetry-core used to build was whatever was
# latest at build time, so two builds of one commit could differ.
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
