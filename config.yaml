proxy:
  port: 8080
  host: 0.0.0.0
  metrics_port: 9090
  # Skip verification of the upstream server's certificate. Leave this false.
  # Turning it on accepts ANY certificate, so the prompts the proxy forwards
  # can be intercepted and altered in transit -- redaction does not protect
  # against that. Replaces the old `ssl_bump`, which did the same thing under
  # a misleading name and defaulted to on.
  upstream_insecure: false

dlp:
  static_terms_file: "terms.txt"
  ml_enabled: true
  ml_threshold: 0.5
  # Max seconds for a single ML analysis before the request fails closed.
  ml_timeout: 30.0
  # NLP Model to use (en_core_web_lg, en_core_web_md, en_core_web_sm)
  nlp_model: "en_core_web_sm"
  # List of entities to detect (null = all). Example: ["PERSON", "PHONE_NUMBER"]
  entities: null
  secrets_provider:
    type: "file" # or "vault"
    vault:
      url: "http://localhost:8200"
      token: "" # Set via VAULT_TOKEN env var
      path: "aidlp/terms"
  replacement_token: "[REDACTED]"
