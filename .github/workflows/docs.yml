name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 18

      # npm ci enforces package-lock.json. npm install may rewrite it and
      # resolve newer transitive versions than were reviewed, so two runs
      # could install different trees despite the committed lockfile.
      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Inventory third-party licences
        working-directory: docs
        run: |
          npx --yes license-checker@25.0.1 --csv > licenses-npm.csv
          python3 ../scripts/check_licenses.py < licenses-npm.csv

      - name: Build docs
        working-directory: docs
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
