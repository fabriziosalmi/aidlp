name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Check lockfile is in sync with pyproject.toml
      run: poetry check --lock

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install SpaCy Model
      # --no-deps is load-bearing. Without it pip re-resolves the model's
      # own requirement (spacy<3.8) and silently downgrades spacy, dragging
      # typer to a version outside the pyproject constraint. That is what
      # removed CliRunner.isolated_filesystem and kept the test run red.
      run: |
        poetry run pip install --no-deps https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

    - name: Verify the installed environment is still consistent
      run: poetry run pip check

    - name: Lint with flake8
      run: |
        poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Removed exit-zero! We enforce linting.
        poetry run flake8 . --count --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        poetry run pip install -q pytest-cov pytest-asyncio
        PYTHONPATH=. poetry run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=60

    # Fails on any vulnerability not explicitly acknowledged in
    # osv-scanner.toml, which records why each exception exists and when it
    # must be re-reviewed. The scanner binary is pinned and checksummed for
    # the same reason the image build now verifies its own downloads.
    - name: Scan dependencies for known vulnerabilities
      env:
        OSV_VERSION: v2.5.1
        OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
      run: |
        curl -sSL -o osv-scanner \
          "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
        echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
        chmod +x osv-scanner
        ./osv-scanner scan source --config=osv-scanner.toml \
          --lockfile=poetry.lock --lockfile=docs/package-lock.json

    - name: Inventory third-party licences
      run: |
        poetry run pip install -q pip-licenses==5.5.5
        poetry run pip-licenses --format=csv --output-file=licenses-python.csv
        python3 scripts/check_licenses.py < licenses-python.csv

    - name: Upload licence inventory
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: licenses-python
        path: licenses-python.csv
        if-no-files-found: warn
