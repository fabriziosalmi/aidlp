version: 2
updates:
  # Python dependencies are resolved from pyproject.toml + poetry.lock.
  # The old requirements.txt was a stale poetry export that contradicted
  # pyproject.toml (it pinned typer 0.9 against a ^0.12 constraint) and
  # that nothing consumed, so dependabot churned on it for months.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The docs site has its own lockfile; npm PRs were already being opened
  # against it even though no npm ecosystem was declared here.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    # vitepress-plugin-mermaid 2.0.17, the latest release (September 2024),
    # declares peer mermaid "10 || 11": mermaid 12 makes `npm ci` fail with
    # ERESOLVE in Deploy Docs, which runs only on push to main, so the pull
    # request (#83) looked green. Revisit when the plugin supports 12.
    ignore:
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
    groups:
      docs-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
