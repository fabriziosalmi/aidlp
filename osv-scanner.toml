# osv-scanner allow-list.
#
# IMPORTANT: every entry here is ACKNOWLEDGED, NOT FIXED. Each records a
# vulnerability that cannot currently be removed, the reason why, and a date
# after which the scanner starts failing again so it must be re-reviewed.
#
# Anything NOT listed fails CI. That is the point: a new vulnerability breaks
# the build, while known-and-blocked ones stay tracked rather than forgotten.
#
# The Python entries trace to one cause: mitmproxy 12.3.1, the newest release,
# caps tornado at 6.5.10, below the fix. Forcing past it would run a
# TLS-intercepting proxy on a dependency version its own maintainers exclude;
# each entry says why aidlp does not reach the vulnerable code.
#
# NOTE: osv-scanner loads this file automatically from the working directory.
# Regenerate it from a scan run with --no-config, or the previous allow-list
# hides the very findings you are trying to enumerate.
#
# Re-review by 2026-12-06.

# ========== Python (poetry.lock) -- ships in the image ==========

# tornado (mitmproxy 12.3.1)
[[IgnoredVulns]]
id = "GHSA-pcg2-g6cj-q92c"
ignoreUntil = 2026-12-06
reason = "tornado: mitmproxy 12.3.1 (newest) caps tornado<=6.5.10; fixed in 6.6. Not reachable in aidlp: it runs mitmdump, which never imports tornado.httputil, tornado.http1connection or tornado.web (the vulnerable header/chunked parsing and RedirectHandler). Measured 2026-10-31: mitmdump with src/proxy_core.py relaying a request loads only tornado, concurrent, escape, gen, ioloop, log, speedups, util."

